# =============================================================================
# MODO YO · docker-compose — Demo web persistente
# Levanta la demo web (Expo Web export + nginx) en el puerto 8080.
# El backend Supabase se despliega por separado (ver supabase/README.md,
# Opción B — self-hosted). Este compose asume una instancia Supabase existente
# cuyas credenciales públicas se pasan por build args.
# =============================================================================
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        EXPO_PUBLIC_SUPABASE_URL: ${EXPO_PUBLIC_SUPABASE_URL:-}
        EXPO_PUBLIC_SUPABASE_ANON_KEY: ${EXPO_PUBLIC_SUPABASE_ANON_KEY:-}
    image: modoyo-web:latest
    container_name: modoyo-web
    restart: unless-stopped
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
